<!DOCTYPE html>
<html>
<head>
  <title>Ejay - Cloud Engr</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }
    .card-3d {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      text-align: center;
      transform: rotateX(10deg) rotateY(-5deg);
      transition: transform 0.5s;
      max-width: 450px;
    }
    .card-3d:hover {
      transform: rotateX(0deg) rotateY(0deg) scale(1.05);
    }
    h1 {
      color: #fff;
      font-size: 48px;
      margin: 0;
      text-shadow: 0 10px 30px rgba(0,255,255,0.5);
    }
    .school {
      color: #00d4ff;
      font-size: 22px;
      margin: 15px 0;
      font-weight: bold;
    }
    .role {
      color: #fff;
      font-size: 18px;
      margin-top: 20px;
      padding: 12px 25px;
      background: linear-gradient(90deg, #00d4ff, #0099ff);
      border-radius: 50px;
      display: inline-block;
      box-shadow: 0 5px 20px rgba(0,212,255,0.4);
    }
  </style>
</head>
<body>
  <div class="card-3d">
    <h1>EJAY</h1>
    <div class="school">CEC Student</div>
    <div class="role">Future Cloud Engineer + DevOps</div>
  </div>
</body>
</html>
