<!DOCTYPE html>
<html>
<head>
  <title>Ejay's Site</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    p {
      color: #333;
      font-size: 18px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 8px 20px;
      border-radius: 50px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hello from Termux!</h1>
    <p>Naka deploy na ko ug website gamit Git + GitHub + Netlify. Gikan ra sa akong phone, no PC needed. Every push sa GitHub = auto update ni. Day 28 mission complete!</p>
    <span class="badge">Live na Boss 💪</span>
  </div>
</body>
</html>
